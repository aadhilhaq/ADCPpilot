[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adcp-dock"
version = "0.1.9"
description = "Browser and command-line workflow for ADCP peptide docking"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Aadhil Haq"}]
maintainers = [{name = "Aadhil Haq"}]
keywords = ["docking", "peptide", "ADCP", "MM-GBSA", "Slurm", "HPC"]
# numpy and RDKit handle the receptor, the grid box and every pose. The other
# tools are programs rather than packages; `adcp-dock check` lists them.
# numpy has no upper bound, because numpy 1 has no build for Python 3.13.
dependencies = ["numpy>=1.21", "rdkit>=2022.3"]

[project.optional-dependencies]
launcher = ["paramiko>=3.0"]
# pdbfixer rebuilds missing side chains and loops, OpenMM runs the restrained
# minimisation, and Biopython reads mmCIF receptors. Without them the
# preparation log says which steps were skipped.
prep = ["pdbfixer", "openmm", "biopython"]
# Everything needed to run on one machine with `adcp-dock local`, including
# pdb2pqr for protonation. ADFRsuite is not on PyPI; `adcp-dock local`
# downloads it from Scripps on first use. AmberTools is not on PyPI either,
# so MM-GBSA needs conda; docking works without it.
local = ["pdb2pqr", "pdbfixer", "openmm", "biopython"]

[project.urls]
Homepage = "https://github.com/aadhilhaq/ADCP_docking"

[project.scripts]
adcp-dock = "adcp_dock.cli:main"

[project.gui-scripts]
adcp-dock-launcher = "adcp_launcher.entry:main"

[tool.setuptools]
# Every package, subpackages included. tests/test_packaging.py builds a
# wheel and checks it against this list.
packages = ["adcp_dock", "adcp_dock._vendor", "adcp_launcher"]

[tool.setuptools.package-data]
adcp_dock = ["static/*.js", "static/*.css",
             # The example run, one pattern per folder depth: setuptools
             # before 62.3 does not expand "**".
             "example_run/*", "example_run/*/*", "example_run/*/*/*",
             "example_run/*/*/*/*"]
